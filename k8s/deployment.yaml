apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-aks-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: azure-aks-demo
  template:
    metadata:
      labels:
        app: azure-aks-demo
    spec:
      containers:
        - name: azure-aks-demo
          image: <ACR_LOGIN_SERVER>/azure-aks-demo:1.0
          ports:
            - containerPort: 3000


#Replace <ACR_LOGIN_SERVER> later with your actual Azure Container Registry login server.
